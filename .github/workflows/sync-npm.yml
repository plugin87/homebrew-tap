name: Follow npm

# The formula exists to install whatever npm calls `latest`. Keeping those in
# step by hand means the tap is stale between a release and the moment someone
# remembers - so it is not done by hand.
#
# The main repository fires `repository_dispatch` after a successful publish, so
# the normal path updates within a minute of a release. The schedule is the
# backstop for a publish that happened some other way.
on:
  repository_dispatch:
    types: [npm-published]
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu-latest has no brew on PATH, so the verify step below died with
      # `brew: command not found` the first time this workflow had real work to
      # do. The scaffold's tests.yml sets Homebrew up and this one did not - a
      # path that only runs on the day a release lands, which is the worst kind
      # to leave untested.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Point the formula at npm's latest
        id: sync
        run: |
          set +e
          node scripts/sync-from-npm.mjs
          code=$?
          set -e
          # 3 means the formula is already current. That is success with
          # nothing to commit, not a failure - a tap that mails a red X every
          # night it had no work to do gets muted, and then a real failure is
          # invisible too.
          if [ "$code" = "3" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Prove the new formula before committing it. A bumped sha256 that does
      # not install is worse than a stale formula: the stale one works.
      - name: Install and test the bumped formula
        if: steps.sync.outputs.changed == 'true'
        run: |
          # setup-homebrew links this checkout in as the tap already, so the
          # formula just edited above is the one `brew` resolves. Creating the
          # tap and copying into it - which this step used to do - failed with
          # "Tap is already installed" and then "source and destination are the
          # same file". Both were ceremony around a thing that had happened.
          brew install --build-from-source "$GITHUB_REPOSITORY_OWNER/tap/ux-ui-agent-skills"
          brew test ux-ui-agent-skills
          brew audit --strict --online --formula "$GITHUB_REPOSITORY_OWNER/tap/ux-ui-agent-skills"

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ux-ui-agent-skills ${{ steps.sync.outputs.version }}

          Generated by scripts/sync-from-npm.mjs from the registry, then proven
          by a real brew install, brew test and brew audit --strict --online
          before this commit was made."
          git push
